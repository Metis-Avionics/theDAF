[workspace]
resolver = "3"
members = [
    "crates/daf-core",
    "crates/daf-application",
    "crates/daf-cache",
    "crates/daf-repository",
    "crates/daf-algorithms",
    "crates/daf-runtime",
    "crates/daf-messaging",
    "crates/daf-http",
    "crates/daf-ffi",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/Metis-Avionics/theDAF"
homepage = "https://github.com/Metis-Avionics/theDAF"
description = "Data Access Factory (DAF): tiered caching, CAS repositories, and generation-tracked data access, wrapping the six-tier cache authority thesix."
keywords = ["data-access", "cache", "repository"]
categories = ["caching", "data-structures"]

[workspace.dependencies]
async-trait = { version = "0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
lru = "0.16"
sha2 = "0.10"
hex = "0.4"
# Cache-generation authority: DAF's `Generation` wraps thesix's present-only
# counter instead of declaring a second authority for one concept. Exact pin —
# the wrapper's semantics follow the pinned upstream, not a range. 0.5.0 moves
# to the HPA data-continuity contract + the governor subsystem (env-detected
# ladder, loud degradation, rebindable rungs, census-bounded autonomy); the
# base surface (`Generation`, default = no redis/sled/oxigraph features) is
# unchanged for the wrapper: daf-core re-verified at the site.
thesix = { version = "=0.5.0", default-features = false }