[workspace]
resolver = "3"
members = [
    "crates/daf-core",
    "crates/daf-application",
    "crates/daf-cache",
    "crates/daf-repository",
    "crates/daf-algorithms",
    "crates/daf-runtime",
    "crates/daf-messaging",
    "crates/daf-http",
    "crates/daf-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
async-trait = { version = "0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
lru = "0.12"
sha2 = "0.10"
hex = "0.4"
# Cache-generation authority: DAF's `Generation` wraps thesix's present-only
# counter instead of declaring a second authority for one concept. Exact pin —
# the wrapper's semantics follow the pinned upstream, not a range.
thesix = { version = "=0.4.0", default-features = false }