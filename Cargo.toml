[workspace]
resolver = "3"
members = [
    "crates/daf-core",
    "crates/daf-application",
    "crates/daf-cache",
    "crates/daf-repository",
    "crates/daf-algorithms",
    "crates/daf-runtime",
    "crates/daf-messaging",
    "crates/daf-http",
    "crates/daf-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
async-trait = { version = "0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
lru = "0.12"
sha2 = "0.10"
hex = "0.4"
