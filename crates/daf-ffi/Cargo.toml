[package]
name = "daf-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C-compatible FFI bindings and parity tooling for the Data Access Factory (DAF)"
repository = "https://github.com/RAliane-REBORN/theDAF"
keywords = ["data-access", "ffi", "bindings"]

[[bin]]
name = "daf-parity"
path = "src/bin/parity.rs"

[dependencies]
daf-core = { path = "../daf-core", version = "0.1.0" }
daf-application = { path = "../daf-application", version = "0.1.0" }
daf-cache = { path = "../daf-cache", version = "0.1.0" }
daf-repository = { path = "../daf-repository", version = "0.1.0" }
daf-algorithms = { path = "../daf-algorithms", version = "0.1.0" }
async-trait.workspace = true
tokio.workspace = true
thiserror.workspace = true
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
