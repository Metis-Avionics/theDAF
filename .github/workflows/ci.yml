name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen --group dev
      - run: uv run ruff check src/ tests/
      - run: uv run mypy src/ --strict

  rust-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen --group dev
      - run: uv run pytest tests/ -q

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  daf-core-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p daf-core

  power-of-ten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen --group dev
      - run: uv run python scripts/power_of_ten.py src/

  parity:
    runs-on: ubuntu-latest
    needs: [rust-test, test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: uv run pytest tests/ -q
      - run: cargo test --workspace

  build:
    runs-on: ubuntu-latest
    needs: [lint, rust-lint, test, rust-test, daf-core-contract, power-of-ten]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          retention-days: 7

  graphify:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen --group dev
      - run: uv run python scripts/graphify_report.py
      - run: uv run python scripts/graphify_affected.py --base ${{ github.event.pull_request.base.sha || 'origin/main' }}
      - uses: actions/upload-artifact@v4
        with:
          name: graphify-artifacts
          path: |
            graphify-out/diagnose.json
            graphify-out/GRAPH_TREE.html
            graphify-out/theDAF-callflow.html
          retention-days: 14
