name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen --group dev
      - run: uv run ruff check src/ tests/
      - run: uv run mypy src/ --strict

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen --group dev
      - run: uv run pytest tests/ -q

  power-of-ten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen --group dev
      - run: uv run python scripts/power_of_ten.py src/

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, power-of-ten]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          retention-days: 7

  graphify:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen --group dev
      - run: uv run python -m graphify extract . --code-only --no-cluster
      - run: uv run python scripts/graphify_report.py
      - run: uv run python scripts/graphify_affected.py --base ${{ github.event.pull_request.base.sha || 'origin/main' }}
      - uses: actions/upload-artifact@v4
        with:
          name: graphify-artifacts
          path: |
            graphify-out/diagnose.json
            graphify-out/GRAPH_TREE.html
            graphify-out/theDAF-callflow.html
          retention-days: 14
