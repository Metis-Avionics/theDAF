name: CI

on:
  push:
    branches: [main]
  pull_requests:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen --group dev
      - run: uv run ruff check src/ tests/
      - run: uv run mypy src/ --strict

  rust-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: [rustfmt, clippy]
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen --group dev
      - run: uv run pytest tests/ -q

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  power-of-ten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen --group dev
      - run: uv run python scripts/power_of_ten.py src/

  power-of-ten-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: python scripts/power_of_ten_rust.py

  parity-differential:
    runs-on: ubuntu-latest
    needs: [rust-test, test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build parity binary
        run: cargo build --bin daf-parity --manifest-path crates/daf-ffi/Cargo.toml
      - name: Run differential parity tests
        run: uv run pytest tests/unit/test_differential_parity.py -v

  build:
    runs-on: ubuntu-latest
    needs: [lint, rust-lint, test, rust-test, power-of-ten, power-of-ten-rust, parity-differential]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          retention-days: 7

  graphify:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen --group dev
      - run: uv run python scripts/graphify_report.py
      - run: uv run python scripts/graphify_affected.py --base ${{ github.event.pull_request.base.sha || 'origin/main' }}
      - uses: actions/upload-artifact@v4
        with:
          name: graphify-artifacts
          path: |
            graphify-out/diagnose.json
            graphify-out/GRAPH_TREE.html
            graphify-out/theDAF-callflow.html
          retention-days: 14
